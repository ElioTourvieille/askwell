<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Démo du widget</title>
  </head>
  <body>
    <h1>Page de démonstration</h1>
    <p>Réglez l'URL de base et la clé ci-dessous, puis rechargez la page.</p>
    <script>
      // Réglages de la démo (aucun secret : la clé publique est faite pour être visible).
      var BASE_URL = "http://localhost:3000";
      var PUBLIC_KEY = "pk_remplacez_moi";
      var s = document.createElement("script");
      s.src = BASE_URL + "/widget.js";
      s.setAttribute("data-key", PUBLIC_KEY);
      document.body.appendChild(s);
    </script>
  </body>
</html>
